<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1120" viewBox="0 0 780 1120" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="g7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="1120" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="390" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="1">Building a Chat LLM from Scratch</text>
  <text x="390" y="66" text-anchor="middle" font-size="12" fill="#94a3b8">nanochat pipeline</text>

  <!-- ── Step 1: Data Collection ── -->
  <rect x="60" y="88" width="660" height="88" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="88" width="8" height="88" rx="4" fill="url(#g1)"/>
  <text x="88" y="118" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1">STEP 1</text>
  <text x="88" y="138" font-size="16" font-weight="700" fill="#f1f5f9">Data Collection</text>
  <text x="88" y="158" font-size="12" fill="#94a3b8">ClimbMix-400B parquet files · downloaded on-demand from HuggingFace Hub</text>
  <text x="680" y="138" text-anchor="end" font-size="11" fill="#6366f1">dataset.py</text>

  <!-- Arrow 1→2 -->
  <line x1="390" y1="176" x2="390" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 2: Tokenizer Training ── -->
  <rect x="60" y="200" width="660" height="100" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="200" width="8" height="100" rx="4" fill="url(#g2)"/>
  <text x="88" y="228" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="1">STEP 2</text>
  <text x="88" y="248" font-size="16" font-weight="700" fill="#f1f5f9">Tokenizer Training</text>
  <text x="88" y="268" font-size="12" fill="#94a3b8">BPE tokenizer (rustbpe + tiktoken) · learns vocabulary from pretraining corpus</text>
  <text x="88" y="285" font-size="12" fill="#94a3b8">Special tokens: BOS · user_start/end · assistant_start/end · python · output</text>
  <text x="680" y="248" text-anchor="end" font-size="11" fill="#0ea5e9">tokenizer.py</text>

  <!-- Arrow 2→3 -->
  <line x1="390" y1="300" x2="390" y2="324" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 3: Model Architecture ── -->
  <rect x="60" y="324" width="660" height="112" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="324" width="8" height="112" rx="4" fill="url(#g3)"/>
  <text x="88" y="352" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="1">STEP 3</text>
  <text x="88" y="372" font-size="16" font-weight="700" fill="#f1f5f9">Model Architecture</text>
  <text x="88" y="392" font-size="12" fill="#94a3b8">Transformer blocks (CausalSelfAttention + MLP) · RoPE positional encoding</text>
  <text x="88" y="409" font-size="12" fill="#94a3b8">QK normalization · Group-Query Attention · Sliding window (SSSL pattern)</text>
  <text x="88" y="426" font-size="12" fill="#94a3b8">Value embeddings · Smear gate · Backout · Per-layer learnable scalars</text>
  <text x="680" y="372" text-anchor="end" font-size="11" fill="#10b981">gpt.py</text>

  <!-- Arrow 3→4 -->
  <line x1="390" y1="436" x2="390" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 4: Pretraining ── -->
  <rect x="60" y="460" width="660" height="112" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="460" width="8" height="112" rx="4" fill="url(#g4)"/>
  <text x="88" y="488" font-size="11" font-weight="700" fill="#fcd34d" letter-spacing="1">STEP 4</text>
  <text x="88" y="508" font-size="16" font-weight="700" fill="#f1f5f9">Pretraining</text>
  <text x="88" y="528" font-size="12" fill="#94a3b8">BOS-aligned best-fit token packing · 100% VRAM utilization, zero padding</text>
  <text x="88" y="545" font-size="12" fill="#94a3b8">MuonAdamW optimizer · Muon for matrices · AdamW for embeddings &amp; scalars</text>
  <text x="88" y="562" font-size="12" fill="#94a3b8">Distributed (DDP) · FP8 optional · gradient accumulation · LR warmup/warmdown</text>
  <text x="680" y="508" text-anchor="end" font-size="11" fill="#f59e0b">base_train.py</text>

  <!-- Arrow 4→5 -->
  <line x1="390" y1="572" x2="390" y2="596" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 5: Base Model Evaluation ── -->
  <rect x="60" y="596" width="660" height="88" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="596" width="8" height="88" rx="4" fill="url(#g5)"/>
  <text x="88" y="624" font-size="11" font-weight="700" fill="#67e8f9" letter-spacing="1">STEP 5</text>
  <text x="88" y="644" font-size="16" font-weight="700" fill="#f1f5f9">Base Model Evaluation</text>
  <text x="88" y="664" font-size="12" fill="#94a3b8">BPB (bits-per-byte): vocab-size-invariant loss · CORE/DCLM benchmark score</text>
  <text x="680" y="644" text-anchor="end" font-size="11" fill="#06b6d4">base_eval.py</text>

  <!-- Arrow 5→6 -->
  <line x1="390" y1="684" x2="390" y2="708" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 6: Supervised Fine-Tuning ── -->
  <rect x="60" y="708" width="660" height="112" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="708" width="8" height="112" rx="4" fill="url(#g6)"/>
  <text x="88" y="736" font-size="11" font-weight="700" fill="#f9a8d4" letter-spacing="1">STEP 6</text>
  <text x="88" y="756" font-size="16" font-weight="700" fill="#f1f5f9">Supervised Fine-Tuning (SFT)</text>
  <text x="88" y="776" font-size="12" fill="#94a3b8">Load pretrained base checkpoint · conversation data with special tokens</text>
  <text x="88" y="793" font-size="12" fill="#94a3b8">Task mixture: MMLU · GSM8K · SmolTalk · HumanEval · ARC · custom JSONL</text>
  <text x="88" y="810" font-size="12" fill="#94a3b8">Loss only on assistant tokens · multi-epoch training over task mixture</text>
  <text x="680" y="756" text-anchor="end" font-size="11" fill="#ec4899">chat_sft.py</text>

  <!-- Arrow 6→7 -->
  <line x1="390" y1="820" x2="390" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 7: Chat Model Evaluation ── -->
  <rect x="60" y="844" width="660" height="88" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="844" width="8" height="88" rx="4" fill="url(#g7)"/>
  <text x="88" y="872" font-size="11" font-weight="700" fill="#bef264" letter-spacing="1">STEP 7</text>
  <text x="88" y="892" font-size="16" font-weight="700" fill="#f1f5f9">Chat Model Evaluation</text>
  <text x="88" y="912" font-size="12" fill="#94a3b8">Task accuracy (MMLU, GSM8K, ARC) · code execution (HumanEval) · reasoning</text>
  <text x="680" y="892" text-anchor="end" font-size="11" fill="#84cc16">chat_eval.py</text>

  <!-- Arrow 7→8 -->
  <line x1="390" y1="932" x2="390" y2="956" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 8: Inference ── -->
  <rect x="60" y="956" width="660" height="112" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="956" width="8" height="112" rx="4" fill="url(#g8)"/>
  <text x="88" y="984" font-size="11" font-weight="700" fill="#fdba74" letter-spacing="1">STEP 8</text>
  <text x="88" y="1004" font-size="16" font-weight="700" fill="#f1f5f9">Inference</text>
  <text x="88" y="1024" font-size="12" fill="#94a3b8">KV cache for efficient autoregressive generation · Flash Attention 3 (H100)</text>
  <text x="88" y="1041" font-size="12" fill="#94a3b8">Temperature + top-k sampling · tool use (sandboxed Python execution)</text>
  <text x="88" y="1058" font-size="12" fill="#94a3b8">Chat CLI (chat_cli.py) · Web UI with streaming (chat_web.py)</text>
  <text x="680" y="1004" text-anchor="end" font-size="11" fill="#f97316">engine.py</text>

  <!-- Footer -->
  <text x="390" y="1100" text-anchor="middle" font-size="11" fill="#475569">~1.3–1.6B params · single 8×H100 node · ~$100 · GPT-2 capability</text>
</svg>
